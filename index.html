<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b0d12"><title>Stream</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eef2ff;font:15px system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;align-items:center;gap:10px;margin:8px 0 22px}.logo{width:38px;height:38px;background:linear-gradient(135deg,#89a5ff,#7356d9);border-radius:11px;display:grid;place-items:center;font-size:20px}.top h1{font-size:20px;margin:0}.top small{color:#9ba6bd}.card{background:#151a24;border:1px solid #2b3244;border-radius:15px;padding:16px;margin-bottom:14px}h2{font-size:16px;margin:0 0 12px}label{display:block;color:#9ba6bd;font-size:13px;margin-bottom:7px}input{width:100%;background:#0c1018;border:1px solid #343c50;border-radius:10px;padding:13px;color:#fff;font-size:14px}button{background:#809cff;color:#091020;font-weight:700;border:0;border-radius:10px;padding:12px 15px;font-size:14px}button.alt{background:#252d3d;color:#fff;border:1px solid #394257}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.hint{font-size:12px;color:#8994ab;margin-top:10px}.video{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center}.video video{width:100%;height:100%}.empty{color:#818ba0;text-align:center;padding:30px 10px}.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#a1abc0;font-size:12px;margin:12px 0}.progress{height:7px;background:#293040;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7394ff,#a17bff)}.files{display:grid;gap:9px}.file{background:#10151e;border:1px solid #30384a;border-radius:10px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.filename{overflow-wrap:anywhere;min-width:0;font-size:13px}.file button{padding:8px 11px;white-space:nowrap}.hide{display:none}
</style></head><body><main>
<div class="top"><div class="logo">▶</div><div><h1>Stream</h1><small>Mobile torrent video player</small></div></div>
<section class="card"><h2>Magnet link</h2><label for="magnet">Paste a magnet URI</label><input id="magnet" placeholder="magnet:?xt=urn:btih:…" autocomplete="off"><div class="row"><button id="load">Load torrent</button><button id="clear" class="alt">Stop</button></div><div class="hint">Requires a server running this app. Browser-only WebTorrent often cannot connect to regular BitTorrent peers.</div></section>
<section class="card"><h2>Player</h2><div class="video" id="video"><div class="empty">Choose a torrent video to play</div></div><div class="status"><span id="state">Idle</span><span id="stats">—</span></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<section class="card hide" id="filesCard"><h2>Torrent files</h2><div class="files" id="files"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let timer=null,videoId=null;
const bytes=n=>{if(!n)return"0 B";let u=["B","KB","MB","GB","TB"],i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]};
function status(s){$("state").textContent=s}
function play(f){videoId=f.id;$("video").innerHTML="";let v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.src="/stream/"+f.id;$("video").appendChild(v);v.play().catch(()=>{});status("Streaming: "+f.name)}
function renderFiles(files){$("files").innerHTML="";const vids=files.filter(f=>/\.(mp4|m4v|webm|mov|mkv|ogv|avi)$/i.test(f.name));[...vids,...files.filter(f=>!vids.includes(f))].forEach(f=>{let r=document.createElement("div");r.className="file";let n=document.createElement("div");n.className="filename";n.textContent=f.name+" · "+bytes(f.length);let b=document.createElement("button");b.textContent="Play";b.onclick=()=>play(f);r.append(n,b);$("files").append(r)});$("filesCard").classList.remove("hide");if(vids.length===1)play(vids[0])}
async function refresh(){try{let s=await(await fetch("/api/status")).json();if(!s.active)return;let p=s.progress*100;$("bar").style.width=p+"%";$("stats").textContent=p.toFixed(1)+"% · ↓ "+bytes(s.downloadSpeed)+"/s · "+s.numPeers+" peers";status(s.name+" · "+bytes(s.downloaded)+" downloaded")}catch(e){}}
$("load").onclick=async()=>{let m=$("magnet").value.trim();if(!m.startsWith("magnet:?"))return status("Paste a valid magnet link");$("load").disabled=true;status("Getting torrent metadata…");try{let r=await fetch("/api/torrent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({magnet:m})});let d=await r.json();if(!r.ok)throw Error(d.error||"Could not load");renderFiles(d.files);if(timer)clearInterval(timer);timer=setInterval(refresh,1000);refresh();}catch(e){status("Error: "+e.message);$("load").disabled=false}};
$("clear").onclick=async()=>{if(timer)clearInterval(timer);timer=null;await fetch("/api/stop",{method:"POST"}).catch(()=>{});$("video").innerHTML='<div class="empty">Choose a torrent video to play</div>';$("files").innerHTML="";$("filesCard").classList.add("hide");$("bar").style.width="0";$("stats").textContent="—";status("Stopped");$("load").disabled=false};
$("magnet").addEventListener("keydown",e=>{if(e.key==="Enter")$("load").click()});
</script></body></html>
